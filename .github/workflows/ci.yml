name: Data Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run data quality checks
        run: python run_checks.py --rules rules.example.yaml
      - name: Log results to Google Sheets
        if: ${{ secrets.SPREADSHEET_ID != '' && secrets.GCP_CREDENTIALS != '' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/gws
          echo "$GCP_CREDENTIALS" > ~/.config/gws/credentials.json
          python run_checks.py --rules rules.example.yaml --sheets-id "$SPREADSHEET_ID"
