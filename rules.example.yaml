datasets:
  - id: customers_bronze
    path: data/customers_bronze.csv
    rules:
      - column: customer_id
        type: not_null
        severity: error
      - column: customer_id
        type: unique
        severity: error
      - column: email
        type: regex
        pattern: "^[^@]+@[^@]+\\.[^@]+$"
        severity: warning
      - column: created_at
        type: freshness
        max_age_days: 7
        severity: warning
      - column: age
        type: range
        min: 0
        max: 120
        severity: error
  - id: orders_silver
    path: data/orders_silver.csv
    rules:
      - column: order_id
        type: not_null
        severity: error
      - column: order_id
        type: unique
        severity: error
      - column: amount
        type: range
        min: 0.01
        max: 10000
        severity: error
      - column: order_date
        type: freshness
        max_age_days: 30
        severity: warning
      - column: status
        type: regex
        pattern: "^(completed|pending|cancelled)$"
        severity: warning
      - column: customer_id
        type: not_null
        severity: error
